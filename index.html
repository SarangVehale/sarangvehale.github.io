<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sarangvehale — Projects</title>
  <style>
    :root {
      --bg: #f9f9f7; --fg: #1a1a18; --muted: #6b6b67;
      --accent: #1a6cf5; --card: #fff; --border: #e3e2dd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141412; --fg: #e8e7e2; --muted: #888882;
        --accent: #5b9bfa; --card: #1e1e1b; --border: #2e2e2b;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
      min-height: 100vh; padding: 4rem 1.5rem;
    }
    .container { max-width: 680px; margin: 0 auto; }
    h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 0.4rem; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 2.5rem; }
    .grid { display: grid; gap: 0.75rem; }
    .card {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 1rem 1.25rem;
      text-decoration: none; color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
    }
    .card-name { font-size: 1rem; font-weight: 500; }
    .card-url { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .arrow { color: var(--muted); font-size: 1.1rem; }
    .card:hover .arrow { color: var(--accent); }
    .empty { color: var(--muted); font-size: 0.95rem; }
    .updated {
      margin-top: 3rem; font-size: 0.8rem;
      color: var(--muted); text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>sarangvehale</h1>
    <p class="subtitle">GitHub Pages projects</p>
    <div class="grid" id="grid">
      <p class="empty">Loading…</p>
    </div>
    <p class="updated" id="updated"></p>
  </div>

  <script>
    async function load() {
      const grid = document.getElementById('grid');

      try {
        const res = await fetch('./repos.json?t=' + Date.now());
        if (!res.ok) throw new Error('repos.json not found');

        const repos = await res.json();

        // Intentionally NOT falling back to live API —
        // repos.json is the source of truth (only Pages-enabled repos).
        if (!repos.length) {
          grid.innerHTML = '<p class="empty">No active GitHub Pages projects found.</p>';
        } else {
          grid.innerHTML = repos.map(r => {
            const url = `https://sarangvehale.github.io/${r.name}/`;
            return `<a class="card" href="${url}" target="_blank" rel="noopener">
              <div>
                <div class="card-name">${r.name}</div>
                <div class="card-url">${url}</div>
              </div>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>`;
          }).join('');
        }

        const lastMod = res.headers.get('last-modified');
        if (lastMod) {
          document.getElementById('updated').textContent =
            'Last updated ' + new Date(lastMod).toLocaleDateString('en', { dateStyle: 'medium' });
        }

      } catch (e) {
        grid.innerHTML = '<p class="empty">Could not load projects. Try refreshing.</p>';
        console.error(e);
      }
    }

    load();
  </script>
</body>
</html>
