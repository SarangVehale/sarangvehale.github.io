name: Update repo index

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate repos.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.error, json, os

          TOKEN = os.environ["GH_TOKEN"]
          USER  = "sarangvehale"
          SELF  = f"{USER}.github.io"

          def gh(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          repos, page = [], 1
          while True:
              batch = gh(f"https://api.github.com/users/{USER}/repos?per_page=100&page={page}")
              if not batch:
                  break
              repos.extend(batch)
              page += 1

          active = []
          for r in repos:
              if r["fork"] or r["private"] or r["name"] == SELF:
                  continue
              try:
                  gh(f"https://api.github.com/repos/{USER}/{r['name']}/pages")
                  active.append({"name": r["name"], "description": r.get("description") or ""})
              except urllib.error.HTTPError:
                  pass

          with open("repos.json", "w") as f:
              json.dump(active, f, indent=2)

          print(f"Found {len(active)} active Pages repos")
          PYEOF

      - name: Commit and push repos.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repos.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update repos.json [skip ci]"
            git push
          fi
